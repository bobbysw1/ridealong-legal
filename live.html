<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RideAlong live location</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body>
<header><div class="wrap"><div class="brand">RideAlong</div><nav><a href="index.html">Home</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="support.html">Support</a></nav></div></header>
<main><div class="card"><h1>Live location</h1><p class="updated" id="status">Checking this live-location link…</p><div id="map" style="height:330px;border-radius:14px;display:none"></div><p class="note">This is a location link shared by its owner. It is not monitored by RideAlong or emergency services. If someone needs urgent help, call 000.</p><p class="updated" id="updated"></p></div></main>
<footer><div class="wrap">© <span id="y"></span> RideAlong · Australia</div></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script>
document.getElementById('y').textContent=new Date().getFullYear();
const token=new URLSearchParams(location.search).get('token')||''; const status=document.getElementById('status'), updated=document.getElementById('updated'), mapEl=document.getElementById('map'); let map, marker;
function setStatus(text){status.textContent=text} function age(iso){return iso?Math.max(0,Math.round((Date.now()-new Date(iso))/1000)):null}
async function poll(){if(!/^[a-f0-9]{32}$/i.test(token)){setStatus('Invalid link.');return} try { const r=await fetch('https://mkeebusqmkazqnpmaoil.supabase.co/functions/v1/live-location?token='+encodeURIComponent(token)); if(r.status===404){setStatus('Invalid link.');return} const d=await r.json(); if(!d.active){setStatus(d.expired?'This link has expired.':'Sharing has stopped.'); mapEl.style.display='none'; updated.textContent='';return} if(d.lat==null||d.lon==null){setStatus('Waiting for the first location update…');return} setStatus('Location is being shared.'); mapEl.style.display='block'; const point=[d.lat,d.lon]; if(!map){map=L.map('map').setView(point,15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);marker=L.marker(point).addTo(map)}else{marker.setLatLng(point);map.setView(point)} const seconds=age(d.updatedAt);updated.textContent=seconds===null?'Waiting for an update.':'Updated '+seconds+'s ago'+(d.accuracy!=null?' · accuracy ±'+Math.round(d.accuracy)+' m':''); }catch(_){setStatus('Could not refresh the location. Trying again…')} }
poll();setInterval(poll,10000);
</script></body></html>
